<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nutrición Deportiva · Calculadoras</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#1c2a37;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:white;border-bottom:1px solid #e0e7ed;padding:18px max(16px,env(safe-area-inset-left));}main{max-width:900px;margin:auto}h1{font-size:24px;margin:0 0 5px}p{margin:0;color:#617082;line-height:1.5}.selector{padding:16px;background:white;border-radius:16px;margin:16px 12px;box-shadow:0 2px 12px #15263b0b}label{font-weight:700;display:block;margin-bottom:9px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}button{background:#fff;color:#203246;border:1px solid #cbd5e1;border-radius:12px;min-height:57px;padding:9px 4px;font:600 14px system-ui;cursor:pointer}button[aria-pressed="true"]{background:#087f70;border-color:#087f70;color:white}.panel{margin:0 12px 16px}.panel[hidden]{display:none}.frame{width:100%;height:78vh;min-height:560px;border:0;border-radius:16px;background:white;display:block}small{display:block;color:#657488;margin-top:9px;font-size:12px}@media(max-width:390px){button{font-size:12px}h1{font-size:22px}}@media(min-width:750px){.frame{height:82vh}}
</style></head><body><header><main><h1>🥇 Nutrición Deportiva</h1><p>Calculadora de hidratos de carbono antes, durante y después de entrenar o competir.</p></main></header><main><section class="selector"><label>1. Selecciona el deporte</label><div class="choices" role="group" aria-label="Deporte"><button type="button" data-sport="ciclismo" aria-pressed="false">🚴<br>Ciclismo</button><button type="button" data-sport="duatlon" aria-pressed="false">🏃🚴<br>Duatlón</button><button type="button" data-sport="triatlon" aria-pressed="false">🏊🚴🏃<br>Triatlón</button></div><small>Selecciona una modalidad para mostrar su calculadora. Los datos de cada modalidad se conservan mientras mantengas abierta esta página.</small></section><div id="panels"></div></main><script>
const pages={"ciclismo": "\n\n\n<html lang=\"es\"><head><meta charset=\"utf-8\"/><meta content=\"width=device-width,initial-scale=1\" name=\"viewport\"/><title>Nutrición Ciclismo<\/title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f6f9;color:#1c2a37;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:780px;margin:auto}h1{font-size:25px;margin:8px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p,.muted{color:#617082}section{background:white;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 12px #15263b0b}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.seg{border-top:1px solid #e9eef2;padding:14px 0}.seg:first-child{border-top:0}input[type=range]{width:100%;accent-color:#087f70}input[type=number]{width:75px;padding:8px;border:1px solid #d2dce5;border-radius:8px;font-size:16px}button{background:white;border:1px solid #d1dce5;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}button.active,.primary{background:#087f70;color:white;border-color:#087f70}.rates{display:flex;gap:6px;flex-wrap:wrap}.rates button{font-size:13px}.product{padding:10px 0;border-top:1px solid #edf0f4}.product small{display:block;color:#657488;margin-top:3px}.counter{display:flex;align-items:center;gap:9px}.counter button{width:33px;height:33px;padding:0;font-size:20px}.counter output{min-width:18px;text-align:center;font-weight:700}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.stats small{display:block;color:#697889}.stats strong{font-size:24px}.bar{background:#e7edf2;border-radius:12px;height:11px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#087f70;transition:width .15s}.primary{width:100%;margin-top:12px;padding:12px}.summary{border-collapse:collapse;width:100%;font-size:13px}.summary td,.summary th{text-align:left;border-bottom:1px solid #edf0f4;padding:9px 4px}.warning{font-size:13px;color:#7c4b20}select{width:100%;margin:8px 0;padding:11px;border:1px solid #d2dce5;border-radius:10px;font-size:16px;background:white;color:#1c2a37}.distance-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.distance-details div{padding:10px 7px;background:#f3f8f7;border-radius:10px;text-align:center}.distance-details small{display:block;color:#617082;font-size:11px}.distance-details strong{font-size:15px}.advice{background:#f0f8f5;border-left:3px solid #087f70;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.45}.advice b{color:#096f5f}.badge{display:inline-block;background:#e4f3ef;color:#096f5f;border-radius:20px;padding:5px 10px;font-size:12px}@media(max-width:460px){.stats strong{font-size:21px}.product .flex{align-items:flex-start}.rates{margin-top:8px}}.status-low{color:#a34b12;font-weight:700}.status-ok{color:#087f70;font-weight:700}.status-high{color:#9c5319;font-weight:700}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profile-grid input{display:block;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px;margin-top:6px;font:inherit}<\/style><\/head><body><main class=\"wrap\"><h1>🚴 Nutrición Ciclismo<\/h1><p>Planifica tu alimentación antes, durante y después de una ruta en bicicleta.<\/p><section><h2>Perfil del deportista<\/h2><div class=\"profile-grid\"><div><label for=\"weight\">Peso (kg)<\/label><input id=\"weight\" max=\"250\" min=\"30\" step=\"0.5\" type=\"number\" value=\"70\"/><\/div><div><label for=\"age\">Edad (años)<\/label><input id=\"age\" max=\"100\" min=\"16\" step=\"1\" type=\"number\" value=\"47\"/><\/div><\/div><p class=\"muted\" style=\"font-size:13px\">El peso sirve para orientar la alimentación previa y la recuperación. La edad no modifica automáticamente los hidratos por hora: influyen más la duración, la intensidad y tu tolerancia digestiva.<\/p><div class=\"advice\" id=\"profileAdvice\"><\/div><\/section><section><h2>Alimentación antes de la salida<\/h2><p class=\"muted\">Selecciona tus alimentos habituales antes de comenzar. Los hidratos son estimaciones por ración y pueden variar según la marca, la fruta y la preparación. La recomendación en g/kg depende del tiempo disponible y de la tolerancia digestiva. Evita comidas ricas en grasas o fibra demasiado cerca de la salida.<\/p><div aria-label=\"Seleccionar alimentación antes de competir\" id=\"beforeFood\"><\/div><div class=\"advice\" id=\"beforeTotal\"><\/div><\/section><section><div class=\"flex\"><h2>Segmentos de la prueba<\/h2><button id=\"reset\">Reiniciar alimentos<\/button><\/div><div id=\"segments\"><\/div><\/section><section><h2>Alimentación después de la prueba<\/h2><p class=\"muted\">Selecciona alimentos naturales para recuperarte. La recomendación de HC de recuperación rápida es especialmente relevante si vuelves a entrenar en las siguientes horas; acompáñalos de proteínas y líquidos según tus necesidades.<\/p><div aria-label=\"Seleccionar alimentación después de competir\" id=\"afterFood\"><\/div><div class=\"advice\" id=\"afterTotal\"><\/div><\/section><section><h2>Resumen de la prueba<\/h2><p class=\"muted\" style=\"font-size:13px\">Las recomendaciones por segmento son rangos orientativos, distintos del objetivo manual que configuras debajo de cada segmento.<\/p><div class=\"stats\"><div><small>Duración total<\/small><strong id=\"duration\"><\/strong><\/div><div><small>Objetivo de hidratos<\/small><strong id=\"target\"><\/strong><\/div><div><small>Hidratos preparados<\/small><strong id=\"carbs\"><\/strong><\/div><div><small>Calorías preparadas<\/small><strong id=\"kcal\"><\/strong><\/div><div><small>Media de hidratos<\/small><strong id=\"average\"><\/strong><\/div><\/div><div class=\"bar\"><div class=\"fill\" id=\"progress\"><\/div><\/div><p id=\"notice\"><\/p><table class=\"summary\" id=\"table\"><\/table><p class=\"warning\" id=\"caffeine\"><\/p><div class=\"advice\" id=\"wholeDay\"><\/div><button class=\"primary\" id=\"copy\">Copiar planificación<\/button><\/section><p class=\"muted\">Valores nutricionales aproximados. La edad no determina por sí sola la necesidad de hidratos. Antes: 1–2 g/kg según tiempo y tolerancia; recuperación rápida: 1–1,2 g/kg/h solo si necesitas reponer glucógeno con rapidez. Ajusta las pautas al contexto y consulta con tu equipo médico sobre cafeína si tienes antecedentes cardíacos.<\/p><\/main><script>const CONFIG={\"segments\": [{\"name\": \"Ruta en bicicleta\", \"hours\": 2, \"rate\": 60, \"edible\": true, \"q\": [1, 1, 0, 1, 0]}], \"products\": [{\"name\": \"Bidón Amix 750 ml\", \"desc\": \"60 g de polvo · 56,4 g HC\", \"carbs\": 56.4, \"kcal\": 228, \"caffeine\": 0}, {\"name\": \"Barrita energética\", \"desc\": \"32 g · 27 g HC\", \"carbs\": 27, \"kcal\": 108, \"caffeine\": 0}, {\"name\": \"Gel con cafeína\", \"desc\": \"40 g · 25 g HC · 60 mg cafeína\", \"carbs\": 25, \"kcal\": 100, \"caffeine\": 60}, {\"name\": \"Bocadillo de guayaba\", \"desc\": \"26,4 g · 22,4 g HC\", \"carbs\": 22.430555555555554, \"kcal\": 90.5138888888889, \"caffeine\": 0}, {\"name\": \"PowerBar PowerGel + Caffeine\", \"desc\": \"67 ml · 30 g HC · 103 kcal · 100 mg cafeína\", \"carbs\": 30, \"kcal\": 103, \"caffeine\": 100}]};const TITLE=\"Ciclismo\";const cfg=CONFIG;let segs=cfg.segments;const products=cfg.products;const beforeProducts=[\n{name:'Atún claro al natural',desc:'1 lata escurrida (≈52 g)',carbs:0,kcal:60,caffeine:0},\n{name:'Tortilla de dos huevos',desc:'2 huevos sin añadidos',carbs:1,kcal:145,caffeine:0},\n{name:'Tortita de arroz',desc:'1 unidad (≈8 g)',carbs:6.5,kcal:30,caffeine:0},\n{name:'Jamón de pavo 92 %',desc:'1 loncha (≈25 g); comprobar etiqueta',carbs:0.5,kcal:25,caffeine:0},\n{name:'Yogur griego natural',desc:'125 g, sin azúcar añadido',carbs:5,kcal:160,caffeine:0},\n{name:'Yogur natural',desc:'125 g, sin azúcar añadido',carbs:6,kcal:75,caffeine:0},\n{name:'Pieza de fruta (plátano)',desc:'1 plátano mediano (≈120 g de parte comestible)',carbs:23,kcal:105,caffeine:0},\n{name:'Vaso de leche',desc:'200 ml de leche de vaca',carbs:9.6,kcal:120,caffeine:0},\n{name:'Café con leche',desc:'Sin azúcar; 150 ml de leche + café',carbs:7.2,kcal:90,caffeine:60},\n{name:'Pan blanco',desc:'90 g de pan blanco',carbs:45,kcal:240,caffeine:0},\n{name:'Frutos secos al natural',desc:'1 ración de 30 g, sin azúcar añadido (valor aproximado)',carbs:5,kcal:180,caffeine:0},\n{name:'Copos de avena',desc:'1 ración de 25 g, en seco (≈15 g HC)',carbs:15,kcal:95,caffeine:0}\n];const extraFood={before:Array(beforeProducts.length).fill(0),after:Array(beforeProducts.length-1).fill(0)};\nconst catalog=phase=>phase==='before'?beforeProducts:beforeProducts.slice(0,-1);\nconst extraTotals=phase=>extraFood[phase].reduce((a,n,i)=>{const p=catalog(phase)[i];a.hc+=n*p.carbs;a.kcal+=n*p.kcal;a.caff+=n*p.caffeine;return a},{hc:0,kcal:0,caff:0});const $=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:1});const rnd=n=>Math.round(n);\nfunction suggested(i,h){\n const total=segs.reduce((a,s)=>a+s.hours,0),minutes=h*60;\n if(total<=1)return {lo:0,hi:30,note:'En sesiones de hasta una hora, los hidratos durante el esfuerzo suelen ser opcionales; depende de intensidad y alimentación previa.'};\n if(total<=2.5)return {lo:30,hi:60,note:'Orientación para esfuerzo prolongado: 30–60 g/h, ajustando a intensidad y tolerancia.'};\n return {lo:60,hi:90,note:'En esfuerzos largos se pueden usar 60–90 g/h si has entrenado la tolerancia digestiva.'};\n }\n const durationLabel=h=>{let m=Math.round(h*60);return m<60?m+' min':(m%60===0?m/60+' h':Math.floor(m/60)+' h '+m%60+' min')};function totals(s){return {hc:s.q.reduce((a,q,i)=>a+q*products[i].carbs,0),kcal:s.q.reduce((a,q,i)=>a+q*products[i].kcal,0),caff:s.q.reduce((a,q,i)=>a+q*products[i].caffeine,0)}}function profileAdvice(){const w=Number($('weight').value),age=Number($('age').value);if(!Number.isFinite(w)||w<30||w>250||!Number.isFinite(age)||age<16||age>100){$('profileAdvice').textContent='Introduce un peso y una edad válidos.';return}const duration=segs.reduce((a,s)=>a+s.hours,0);const beforeLo=rnd(w*1),beforeHi=rnd(w*2),afterLo=rnd(w*1),afterHi=rnd(w*1.2);$('profileAdvice').innerHTML=`<b>Orientación personalizada<\/b><br>Antes de competir: ${beforeLo}–${beforeHi} g HC (1–2 g/kg unas 1–3 h antes, según tolerancia y tiempo disponible).<br>Recuperación rápida si vuelves a entrenar pronto: ${afterLo}–${afterHi} g HC por hora durante las primeras horas (1–1,2 g/kg/h).<br>Durante la prueba (${durationLabel(duration)}): usa las recomendaciones de cada segmento; no se ajustan automáticamente por edad o peso.`;}function drawExtraFood(){for(const phase of ['before','after']){const q=extraFood[phase],items=catalog(phase),t=extraTotals(phase);$(phase+'Food').innerHTML=items.map((p,i)=>`<div class=\"product\"><div class=\"flex\"><div><b>${p.name}<\/b><small>${p.desc} · ${fmt(p.carbs)} g HC/ración<\/small><\/div><div class=\"counter\"><button data-extra=\"${phase}\" data-product=\"${i}\" data-delta=\"-1\" aria-label=\"Quitar ${p.name}\">−<\/button><output>${q[i]}<\/output><button data-extra=\"${phase}\" data-product=\"${i}\" data-delta=\"1\" aria-label=\"Añadir ${p.name}\">+<\/button><\/div><\/div><\/div>`).join('');const w=Number($('weight').value);const valid=Number.isFinite(w)&&w>=30&&w<=250;const lo=valid?Math.round(w):0,hi=valid?Math.round(w*(phase==='before'?2:1.2)):0;const gap=lo-t.hc;let status='';if(!valid){status='Introduce un peso válido para ver el objetivo.'}else if(t.hc<lo){status=`<span class=\"status-low\">Por debajo del rango: faltan ≈${fmt(gap)} g HC para alcanzar el mínimo.<\/span>`}else if(t.hc<=hi){status='<span class=\"status-ok\">Dentro del rango orientativo de HC.<\/span>'}else{status=`<span class=\"status-high\">Por encima del rango: ≈${fmt(t.hc-hi)} g HC de más.<\/span>`}$(phase+'Total').innerHTML=`<b>Objetivo orientativo: ${valid?fmt(lo)+'–'+fmt(hi)+' g HC':'—'}<\/b><br><b>Alimentos seleccionados: ${fmt(t.hc)} g HC · ${rnd(t.kcal)} kcal<\/b>${t.caff?' · ≈'+rnd(t.caff)+' mg cafeína':''}<br>${status}<div class=\"bar\"><div class=\"fill\" style=\"width:${valid?Math.min(100,100*t.hc/lo):0}%\"><\/div><\/div><small>${phase==='before'?'Referencia: 1–2 g/kg aproximadamente 1–3 h antes; ajusta según la comida previa y el margen hasta la salida.':'Referencia de recuperación rápida: 1–1,2 g/kg/h cuando hay poco tiempo entre sesiones; no es necesario alcanzar este rango de inmediato si tienes muchas horas o días para recuperarte.'} La edad no cambia automáticamente este cálculo.<\/small>`;}}\nfunction draw(){profileAdvice();drawExtraFood();let distances=[\"Ruta libre\"];let html='';segs.forEach((s,i)=>{let t=totals(s), rec=suggested(i,s.hours), low=Math.round(rec.lo*s.hours), high=Math.round(rec.hi*s.hours);html+=`<div class=\"seg\"><div class=\"flex\"><h3>${i+1}. ${s.name} · ${distances[i]}<\/h3><span class=\"badge\">${durationLabel(s.hours)}<\/span><\/div><label>Duración: <strong>${durationLabel(s.hours)}<\/strong><\/label><input type=\"range\" data-hours=\"${i}\" min=\"0.0833333333333\" max=\"8\" step=\"0.0833333333333\" value=\"${s.hours}\"><div class=\"advice\"><b>HC recomendados para este segmento: ${low===high?low+' g':low+'–'+high+' g'}<\/b> (${rec.lo===rec.hi?rec.lo:rec.lo+'–'+rec.hi} g/h).<br>${rec.note}<\/div><div class=\"flex\" style=\"margin:9px 0\"><span>Tu objetivo<\/span><div class=\"rates\">${(s.edible?[0,30,40,60,90]:[0]).map(r=>`<button data-rate=\"${i}\" data-value=\"${r}\" class=\"${r===s.rate?'active':''}\">${r===0?'0':r+' g/h'}<\/button>`).join('')}<\/div><\/div>${s.edible?products.map((p,j)=>`<div class=\"product\"><div class=\"flex\"><div><b>${p.name}<\/b><small>${p.desc}<\/small><\/div><div class=\"counter\"><button data-seg=\"${i}\" data-product=\"${j}\" data-delta=\"-1\" aria-label=\"Quitar ${p.name}\">−<\/button><output>${s.q[j]}<\/output><button data-seg=\"${i}\" data-product=\"${j}\" data-delta=\"1\" aria-label=\"Añadir ${p.name}\">+<\/button><\/div><\/div><\/div>`).join(''):'<p class=\"muted\">Durante la natación no se planifica ingesta. Puedes ajustar la duración; el objetivo de hidratos se establece en 0.<\/p>'}<p><b>Segmento:<\/b> ${rnd(t.hc)} g HC · ${rnd(t.kcal)} Cal · Objetivo ${rnd(s.hours*s.rate)} g<\/p><\/div>`});$('segments').innerHTML=html;const all=segs.reduce((a,s)=>{let t=totals(s);a.h+=s.hours;a.target+=s.hours*s.rate;a.hc+=t.hc;a.kcal+=t.kcal;a.caff+=t.caff;return a},{h:0,target:0,hc:0,kcal:0,caff:0});$('duration').textContent=durationLabel(all.h);$('target').textContent=rnd(all.target)+' g';$('carbs').textContent=rnd(all.hc)+' g';$('kcal').textContent=rnd(all.kcal)+' Cal';$('average').textContent=fmt(all.hc/(all.h||1))+' g/h';$('progress').style.width=Math.min(100,all.target?100*all.hc/all.target:100)+'%';let d=all.hc-all.target;$('notice').textContent=d< -5?`Faltan ${rnd(-d)} g de hidratos para el objetivo configurado.`:d>15?`Hay ${rnd(d)} g de hidratos por encima del objetivo.`:'La planificación se aproxima al objetivo.';$('wholeDay').textContent='Plan completo (antes + competición + después): '+rnd(all.hc+extraTotals('before').hc+extraTotals('after').hc)+' g HC · '+rnd(all.kcal+extraTotals('before').kcal+extraTotals('after').kcal)+' kcal. Los objetivos y la barra de progreso anteriores corresponden únicamente a la competición.';$('caffeine').textContent=(all.caff+extraTotals('before').caff+extraTotals('after').caff)?`Cafeína total (antes, durante y después): ${rnd(all.caff+extraTotals('before').caff+extraTotals('after').caff)} mg. Consulta con tu cardiólogo su idoneidad.`:'';$('table').innerHTML='<tr><th>Segmento<\/th><th>Objetivo<\/th><th>Preparado<\/th><\/tr>'+segs.map(s=>`<tr><td>${s.name}<\/td><td>${rnd(s.hours*s.rate)} g<\/td><td>${rnd(totals(s).hc)} g<\/td><\/tr>`).join('');}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.extra!==undefined){let q=extraFood[b.dataset.extra],j=+b.dataset.product;q[j]=Math.max(0,Math.min(30,q[j]+Number(b.dataset.delta)));draw()}else if(b.dataset.seg!==undefined){let s=segs[+b.dataset.seg],j=+b.dataset.product;s.q[j]=Math.max(0,Math.min(30,s.q[j]+Number(b.dataset.delta)));draw()}else if(b.dataset.rate!==undefined){segs[+b.dataset.rate].rate=Number(b.dataset.value);draw()}});document.addEventListener('change',e=>{if(e.target.dataset.hours!==undefined){segs[+e.target.dataset.hours].hours=Number(e.target.value);draw()}});$('reset').onclick=()=>{segs.forEach(s=>s.q=Array(products.length).fill(0));extraFood.before=Array(beforeProducts.length).fill(0);extraFood.after=Array(catalog('after').length).fill(0);draw()};$('copy').onclick=async()=>{let txt='Plan nutricional '+TITLE+'\\nANTES: '+extraFood.before.map((q,i)=>q+' × '+beforeProducts[i].name).join(', ')+'\\n'+segs.map(s=>s.name+' ('+durationLabel(s.hours)+', '+s.rate+' g/h): '+s.q.map((q,i)=>q+' × '+products[i].name).join(', ')+'; HC '+rnd(totals(s).hc)+' g').join('\\n')+'\\nDESPUÉS: '+extraFood.after.map((q,i)=>q+' × '+catalog('after')[i].name).join(', ');try{await navigator.clipboard.writeText(txt);$('copy').textContent='¡Copiado!'}catch{prompt('Copia la planificación:',txt)}};$('weight').addEventListener('input',draw);$('age').addEventListener('input',draw);draw();<\/script><\/body><\/html>", "duatlon": "\n\n\n<html lang=\"es\"><head><meta charset=\"utf-8\"/><meta content=\"width=device-width,initial-scale=1\" name=\"viewport\"/><title>Nutrición Duatlón<\/title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f6f9;color:#1c2a37;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:780px;margin:auto}h1{font-size:25px;margin:8px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p,.muted{color:#617082}section{background:white;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 12px #15263b0b}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.seg{border-top:1px solid #e9eef2;padding:14px 0}.seg:first-child{border-top:0}input[type=range]{width:100%;accent-color:#087f70}input[type=number]{width:75px;padding:8px;border:1px solid #d2dce5;border-radius:8px;font-size:16px}button{background:white;border:1px solid #d1dce5;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}button.active,.primary{background:#087f70;color:white;border-color:#087f70}.rates{display:flex;gap:6px;flex-wrap:wrap}.rates button{font-size:13px}.product{padding:10px 0;border-top:1px solid #edf0f4}.product small{display:block;color:#657488;margin-top:3px}.counter{display:flex;align-items:center;gap:9px}.counter button{width:33px;height:33px;padding:0;font-size:20px}.counter output{min-width:18px;text-align:center;font-weight:700}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.stats small{display:block;color:#697889}.stats strong{font-size:24px}.bar{background:#e7edf2;border-radius:12px;height:11px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#087f70;transition:width .15s}.primary{width:100%;margin-top:12px;padding:12px}.summary{border-collapse:collapse;width:100%;font-size:13px}.summary td,.summary th{text-align:left;border-bottom:1px solid #edf0f4;padding:9px 4px}.warning{font-size:13px;color:#7c4b20}select{width:100%;margin:8px 0;padding:11px;border:1px solid #d2dce5;border-radius:10px;font-size:16px;background:white;color:#1c2a37}.distance-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.distance-details div{padding:10px 7px;background:#f3f8f7;border-radius:10px;text-align:center}.distance-details small{display:block;color:#617082;font-size:11px}.distance-details strong{font-size:15px}.advice{background:#f0f8f5;border-left:3px solid #087f70;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.45}.advice b{color:#096f5f}.badge{display:inline-block;background:#e4f3ef;color:#096f5f;border-radius:20px;padding:5px 10px;font-size:12px}@media(max-width:460px){.stats strong{font-size:21px}.product .flex{align-items:flex-start}.rates{margin-top:8px}}.status-low{color:#a34b12;font-weight:700}.status-ok{color:#087f70;font-weight:700}.status-high{color:#9c5319;font-weight:700}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profile-grid input{display:block;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px;margin-top:6px;font:inherit}<\/style><\/head><body><main class=\"wrap\"><h1>🏃🚴🏃 Nutrición Duatlón<\/h1><p>Planifica la alimentación del duatlón sprint (5 km carrera, 20 km bicicleta, 2,5 km carrera).<\/p><section><h2>Duatlón sprint · 5 km / 20 km / 2,5 km<\/h2><p>Modifica el tiempo previsto de cada segmento para personalizar la ingesta.<\/p><\/section><section><h2>Perfil del deportista<\/h2><div class=\"profile-grid\"><div><label for=\"weight\">Peso (kg)<\/label><input id=\"weight\" max=\"250\" min=\"30\" step=\"0.5\" type=\"number\" value=\"70\"/><\/div><div><label for=\"age\">Edad (años)<\/label><input id=\"age\" max=\"100\" min=\"16\" step=\"1\" type=\"number\" value=\"47\"/><\/div><\/div><p class=\"muted\" style=\"font-size:13px\">El peso sirve para orientar la alimentación previa y la recuperación. La edad no modifica automáticamente los hidratos por hora: influyen más la duración, la intensidad y tu tolerancia digestiva.<\/p><div class=\"advice\" id=\"profileAdvice\"><\/div><\/section><section><h2>Alimentación antes de la salida<\/h2><p class=\"muted\">Selecciona tus alimentos habituales antes de comenzar. Los hidratos son estimaciones por ración y pueden variar según la marca, la fruta y la preparación. La recomendación en g/kg depende del tiempo disponible y de la tolerancia digestiva. Evita comidas ricas en grasas o fibra demasiado cerca de la salida.<\/p><div aria-label=\"Seleccionar alimentación antes de competir\" id=\"beforeFood\"><\/div><div class=\"advice\" id=\"beforeTotal\"><\/div><\/section><section><div class=\"flex\"><h2>Segmentos de la prueba<\/h2><button id=\"reset\">Reiniciar alimentos<\/button><\/div><div id=\"segments\"><\/div><\/section><section><h2>Alimentación después de la prueba<\/h2><p class=\"muted\">Selecciona alimentos naturales para recuperarte. La recomendación de HC de recuperación rápida es especialmente relevante si vuelves a entrenar en las siguientes horas; acompáñalos de proteínas y líquidos según tus necesidades.<\/p><div aria-label=\"Seleccionar alimentación después de competir\" id=\"afterFood\"><\/div><div class=\"advice\" id=\"afterTotal\"><\/div><\/section><section><h2>Resumen de la prueba<\/h2><p class=\"muted\" style=\"font-size:13px\">Las recomendaciones por segmento son rangos orientativos, distintos del objetivo manual que configuras debajo de cada segmento.<\/p><div class=\"stats\"><div><small>Duración total<\/small><strong id=\"duration\"><\/strong><\/div><div><small>Objetivo de hidratos<\/small><strong id=\"target\"><\/strong><\/div><div><small>Hidratos preparados<\/small><strong id=\"carbs\"><\/strong><\/div><div><small>Calorías preparadas<\/small><strong id=\"kcal\"><\/strong><\/div><div><small>Media de hidratos<\/small><strong id=\"average\"><\/strong><\/div><\/div><div class=\"bar\"><div class=\"fill\" id=\"progress\"><\/div><\/div><p id=\"notice\"><\/p><table class=\"summary\" id=\"table\"><\/table><p class=\"warning\" id=\"caffeine\"><\/p><div class=\"advice\" id=\"wholeDay\"><\/div><button class=\"primary\" id=\"copy\">Copiar planificación<\/button><\/section><p class=\"muted\">Valores nutricionales aproximados. La edad no determina por sí sola la necesidad de hidratos. Antes: 1–2 g/kg según tiempo y tolerancia; recuperación rápida: 1–1,2 g/kg/h solo si necesitas reponer glucógeno con rapidez. Ajusta las pautas al contexto y consulta con tu equipo médico sobre cafeína si tienes antecedentes cardíacos.<\/p><\/main><script>const CONFIG={\"segments\": [{\"name\": \"Carrera 1\", \"hours\": 0.4166666666666667, \"rate\": 30, \"edible\": true, \"q\": [0, 0, 0, 0, 0]}, {\"name\": \"Ciclismo\", \"hours\": 0.75, \"rate\": 40, \"edible\": true, \"q\": [1, 0, 0, 0, 0]}, {\"name\": \"Carrera 2\", \"hours\": 0.25, \"rate\": 0, \"edible\": true, \"q\": [0, 0, 0, 0, 0]}], \"products\": [{\"name\": \"Bidón Amix 750 ml\", \"desc\": \"60 g de polvo · 56,4 g HC\", \"carbs\": 56.4, \"kcal\": 228, \"caffeine\": 0}, {\"name\": \"Barrita energética\", \"desc\": \"32 g · 27 g HC\", \"carbs\": 27, \"kcal\": 108, \"caffeine\": 0}, {\"name\": \"Gel con cafeína\", \"desc\": \"40 g · 25 g HC · 60 mg cafeína\", \"carbs\": 25, \"kcal\": 100, \"caffeine\": 60}, {\"name\": \"Bocadillo de guayaba\", \"desc\": \"26,4 g · 22,4 g HC\", \"carbs\": 22.430555555555554, \"kcal\": 90.5138888888889, \"caffeine\": 0}, {\"name\": \"PowerBar PowerGel + Caffeine\", \"desc\": \"67 ml · 30 g HC · 103 kcal · 100 mg cafeína\", \"carbs\": 30, \"kcal\": 103, \"caffeine\": 100}]};const TITLE=\"Duatlón\";const cfg=CONFIG;let segs=cfg.segments;const products=cfg.products;const beforeProducts=[\n{name:'Atún claro al natural',desc:'1 lata escurrida (≈52 g)',carbs:0,kcal:60,caffeine:0},\n{name:'Tortilla de dos huevos',desc:'2 huevos sin añadidos',carbs:1,kcal:145,caffeine:0},\n{name:'Tortita de arroz',desc:'1 unidad (≈8 g)',carbs:6.5,kcal:30,caffeine:0},\n{name:'Jamón de pavo 92 %',desc:'1 loncha (≈25 g); comprobar etiqueta',carbs:0.5,kcal:25,caffeine:0},\n{name:'Yogur griego natural',desc:'125 g, sin azúcar añadido',carbs:5,kcal:160,caffeine:0},\n{name:'Yogur natural',desc:'125 g, sin azúcar añadido',carbs:6,kcal:75,caffeine:0},\n{name:'Pieza de fruta (plátano)',desc:'1 plátano mediano (≈120 g de parte comestible)',carbs:23,kcal:105,caffeine:0},\n{name:'Vaso de leche',desc:'200 ml de leche de vaca',carbs:9.6,kcal:120,caffeine:0},\n{name:'Café con leche',desc:'Sin azúcar; 150 ml de leche + café',carbs:7.2,kcal:90,caffeine:60},\n{name:'Pan blanco',desc:'90 g de pan blanco',carbs:45,kcal:240,caffeine:0},\n{name:'Frutos secos al natural',desc:'1 ración de 30 g, sin azúcar añadido (valor aproximado)',carbs:5,kcal:180,caffeine:0},\n{name:'Copos de avena',desc:'1 ración de 25 g, en seco (≈15 g HC)',carbs:15,kcal:95,caffeine:0}\n];const extraFood={before:Array(beforeProducts.length).fill(0),after:Array(beforeProducts.length-1).fill(0)};\nconst catalog=phase=>phase==='before'?beforeProducts:beforeProducts.slice(0,-1);\nconst extraTotals=phase=>extraFood[phase].reduce((a,n,i)=>{const p=catalog(phase)[i];a.hc+=n*p.carbs;a.kcal+=n*p.kcal;a.caff+=n*p.caffeine;return a},{hc:0,kcal:0,caff:0});const $=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:1});const rnd=n=>Math.round(n);\nfunction suggested(i,h){\n const total=segs.reduce((a,s)=>a+s.hours,0),minutes=h*60;\n if(total<=1)return {lo:0,hi:30,note:'En sesiones de hasta una hora, los hidratos durante el esfuerzo suelen ser opcionales; depende de intensidad y alimentación previa.'};\n if(total<=2.5)return {lo:30,hi:60,note:'Orientación para esfuerzo prolongado: 30–60 g/h, ajustando a intensidad y tolerancia.'};\n return {lo:60,hi:90,note:'En esfuerzos largos se pueden usar 60–90 g/h si has entrenado la tolerancia digestiva.'};\n }\n const durationLabel=h=>{let m=Math.round(h*60);return m<60?m+' min':(m%60===0?m/60+' h':Math.floor(m/60)+' h '+m%60+' min')};function totals(s){return {hc:s.q.reduce((a,q,i)=>a+q*products[i].carbs,0),kcal:s.q.reduce((a,q,i)=>a+q*products[i].kcal,0),caff:s.q.reduce((a,q,i)=>a+q*products[i].caffeine,0)}}function profileAdvice(){const w=Number($('weight').value),age=Number($('age').value);if(!Number.isFinite(w)||w<30||w>250||!Number.isFinite(age)||age<16||age>100){$('profileAdvice').textContent='Introduce un peso y una edad válidos.';return}const duration=segs.reduce((a,s)=>a+s.hours,0);const beforeLo=rnd(w*1),beforeHi=rnd(w*2),afterLo=rnd(w*1),afterHi=rnd(w*1.2);$('profileAdvice').innerHTML=`<b>Orientación personalizada<\/b><br>Antes de competir: ${beforeLo}–${beforeHi} g HC (1–2 g/kg unas 1–3 h antes, según tolerancia y tiempo disponible).<br>Recuperación rápida si vuelves a entrenar pronto: ${afterLo}–${afterHi} g HC por hora durante las primeras horas (1–1,2 g/kg/h).<br>Durante la prueba (${durationLabel(duration)}): usa las recomendaciones de cada segmento; no se ajustan automáticamente por edad o peso.`;}function drawExtraFood(){for(const phase of ['before','after']){const q=extraFood[phase],items=catalog(phase),t=extraTotals(phase);$(phase+'Food').innerHTML=items.map((p,i)=>`<div class=\"product\"><div class=\"flex\"><div><b>${p.name}<\/b><small>${p.desc} · ${fmt(p.carbs)} g HC/ración<\/small><\/div><div class=\"counter\"><button data-extra=\"${phase}\" data-product=\"${i}\" data-delta=\"-1\" aria-label=\"Quitar ${p.name}\">−<\/button><output>${q[i]}<\/output><button data-extra=\"${phase}\" data-product=\"${i}\" data-delta=\"1\" aria-label=\"Añadir ${p.name}\">+<\/button><\/div><\/div><\/div>`).join('');const w=Number($('weight').value);const valid=Number.isFinite(w)&&w>=30&&w<=250;const lo=valid?Math.round(w):0,hi=valid?Math.round(w*(phase==='before'?2:1.2)):0;const gap=lo-t.hc;let status='';if(!valid){status='Introduce un peso válido para ver el objetivo.'}else if(t.hc<lo){status=`<span class=\"status-low\">Por debajo del rango: faltan ≈${fmt(gap)} g HC para alcanzar el mínimo.<\/span>`}else if(t.hc<=hi){status='<span class=\"status-ok\">Dentro del rango orientativo de HC.<\/span>'}else{status=`<span class=\"status-high\">Por encima del rango: ≈${fmt(t.hc-hi)} g HC de más.<\/span>`}$(phase+'Total').innerHTML=`<b>Objetivo orientativo: ${valid?fmt(lo)+'–'+fmt(hi)+' g HC':'—'}<\/b><br><b>Alimentos seleccionados: ${fmt(t.hc)} g HC · ${rnd(t.kcal)} kcal<\/b>${t.caff?' · ≈'+rnd(t.caff)+' mg cafeína':''}<br>${status}<div class=\"bar\"><div class=\"fill\" style=\"width:${valid?Math.min(100,100*t.hc/lo):0}%\"><\/div><\/div><small>${phase==='before'?'Referencia: 1–2 g/kg aproximadamente 1–3 h antes; ajusta según la comida previa y el margen hasta la salida.':'Referencia de recuperación rápida: 1–1,2 g/kg/h cuando hay poco tiempo entre sesiones; no es necesario alcanzar este rango de inmediato si tienes muchas horas o días para recuperarte.'} La edad no cambia automáticamente este cálculo.<\/small>`;}}\nfunction draw(){profileAdvice();drawExtraFood();let distances=[\"5 km\", \"20 km\", \"2,5 km\"];let html='';segs.forEach((s,i)=>{let t=totals(s), rec=suggested(i,s.hours), low=Math.round(rec.lo*s.hours), high=Math.round(rec.hi*s.hours);html+=`<div class=\"seg\"><div class=\"flex\"><h3>${i+1}. ${s.name} · ${distances[i]}<\/h3><span class=\"badge\">${durationLabel(s.hours)}<\/span><\/div><label>Duración: <strong>${durationLabel(s.hours)}<\/strong><\/label><input type=\"range\" data-hours=\"${i}\" min=\"0.0833333333333\" max=\"8\" step=\"0.0833333333333\" value=\"${s.hours}\"><div class=\"advice\"><b>HC recomendados para este segmento: ${low===high?low+' g':low+'–'+high+' g'}<\/b> (${rec.lo===rec.hi?rec.lo:rec.lo+'–'+rec.hi} g/h).<br>${rec.note}<\/div><div class=\"flex\" style=\"margin:9px 0\"><span>Tu objetivo<\/span><div class=\"rates\">${(s.edible?[0,30,40,60,90]:[0]).map(r=>`<button data-rate=\"${i}\" data-value=\"${r}\" class=\"${r===s.rate?'active':''}\">${r===0?'0':r+' g/h'}<\/button>`).join('')}<\/div><\/div>${s.edible?products.map((p,j)=>`<div class=\"product\"><div class=\"flex\"><div><b>${p.name}<\/b><small>${p.desc}<\/small><\/div><div class=\"counter\"><button data-seg=\"${i}\" data-product=\"${j}\" data-delta=\"-1\" aria-label=\"Quitar ${p.name}\">−<\/button><output>${s.q[j]}<\/output><button data-seg=\"${i}\" data-product=\"${j}\" data-delta=\"1\" aria-label=\"Añadir ${p.name}\">+<\/button><\/div><\/div><\/div>`).join(''):'<p class=\"muted\">Durante la natación no se planifica ingesta. Puedes ajustar la duración; el objetivo de hidratos se establece en 0.<\/p>'}<p><b>Segmento:<\/b> ${rnd(t.hc)} g HC · ${rnd(t.kcal)} Cal · Objetivo ${rnd(s.hours*s.rate)} g<\/p><\/div>`});$('segments').innerHTML=html;const all=segs.reduce((a,s)=>{let t=totals(s);a.h+=s.hours;a.target+=s.hours*s.rate;a.hc+=t.hc;a.kcal+=t.kcal;a.caff+=t.caff;return a},{h:0,target:0,hc:0,kcal:0,caff:0});$('duration').textContent=durationLabel(all.h);$('target').textContent=rnd(all.target)+' g';$('carbs').textContent=rnd(all.hc)+' g';$('kcal').textContent=rnd(all.kcal)+' Cal';$('average').textContent=fmt(all.hc/(all.h||1))+' g/h';$('progress').style.width=Math.min(100,all.target?100*all.hc/all.target:100)+'%';let d=all.hc-all.target;$('notice').textContent=d< -5?`Faltan ${rnd(-d)} g de hidratos para el objetivo configurado.`:d>15?`Hay ${rnd(d)} g de hidratos por encima del objetivo.`:'La planificación se aproxima al objetivo.';$('wholeDay').textContent='Plan completo (antes + competición + después): '+rnd(all.hc+extraTotals('before').hc+extraTotals('after').hc)+' g HC · '+rnd(all.kcal+extraTotals('before').kcal+extraTotals('after').kcal)+' kcal. Los objetivos y la barra de progreso anteriores corresponden únicamente a la competición.';$('caffeine').textContent=(all.caff+extraTotals('before').caff+extraTotals('after').caff)?`Cafeína total (antes, durante y después): ${rnd(all.caff+extraTotals('before').caff+extraTotals('after').caff)} mg. Consulta con tu cardiólogo su idoneidad.`:'';$('table').innerHTML='<tr><th>Segmento<\/th><th>Objetivo<\/th><th>Preparado<\/th><\/tr>'+segs.map(s=>`<tr><td>${s.name}<\/td><td>${rnd(s.hours*s.rate)} g<\/td><td>${rnd(totals(s).hc)} g<\/td><\/tr>`).join('');}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.extra!==undefined){let q=extraFood[b.dataset.extra],j=+b.dataset.product;q[j]=Math.max(0,Math.min(30,q[j]+Number(b.dataset.delta)));draw()}else if(b.dataset.seg!==undefined){let s=segs[+b.dataset.seg],j=+b.dataset.product;s.q[j]=Math.max(0,Math.min(30,s.q[j]+Number(b.dataset.delta)));draw()}else if(b.dataset.rate!==undefined){segs[+b.dataset.rate].rate=Number(b.dataset.value);draw()}});document.addEventListener('change',e=>{if(e.target.dataset.hours!==undefined){segs[+e.target.dataset.hours].hours=Number(e.target.value);draw()}});$('reset').onclick=()=>{segs.forEach(s=>s.q=Array(products.length).fill(0));extraFood.before=Array(beforeProducts.length).fill(0);extraFood.after=Array(catalog('after').length).fill(0);draw()};$('copy').onclick=async()=>{let txt='Plan nutricional '+TITLE+'\\nANTES: '+extraFood.before.map((q,i)=>q+' × '+beforeProducts[i].name).join(', ')+'\\n'+segs.map(s=>s.name+' ('+durationLabel(s.hours)+', '+s.rate+' g/h): '+s.q.map((q,i)=>q+' × '+products[i].name).join(', ')+'; HC '+rnd(totals(s).hc)+' g').join('\\n')+'\\nDESPUÉS: '+extraFood.after.map((q,i)=>q+' × '+catalog('after')[i].name).join(', ');try{await navigator.clipboard.writeText(txt);$('copy').textContent='¡Copiado!'}catch{prompt('Copia la planificación:',txt)}};$('weight').addEventListener('input',draw);$('age').addEventListener('input',draw);draw();<\/script><\/body><\/html>", "triatlon": "<html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Nutrición Triatlón<\/title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f6f9;color:#1c2a37;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:780px;margin:auto}h1{font-size:25px;margin:8px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p,.muted{color:#617082}section{background:white;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 12px #15263b0b}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.seg{border-top:1px solid #e9eef2;padding:14px 0}.seg:first-child{border-top:0}input[type=range]{width:100%;accent-color:#087f70}input[type=number]{width:75px;padding:8px;border:1px solid #d2dce5;border-radius:8px;font-size:16px}button{background:white;border:1px solid #d1dce5;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}button.active,.primary{background:#087f70;color:white;border-color:#087f70}.rates{display:flex;gap:6px;flex-wrap:wrap}.rates button{font-size:13px}.product{padding:10px 0;border-top:1px solid #edf0f4}.product small{display:block;color:#657488;margin-top:3px}.counter{display:flex;align-items:center;gap:9px}.counter button{width:33px;height:33px;padding:0;font-size:20px}.counter output{min-width:18px;text-align:center;font-weight:700}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.stats small{display:block;color:#697889}.stats strong{font-size:24px}.bar{background:#e7edf2;border-radius:12px;height:11px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#087f70;transition:width .15s}.primary{width:100%;margin-top:12px;padding:12px}.summary{border-collapse:collapse;width:100%;font-size:13px}.summary td,.summary th{text-align:left;border-bottom:1px solid #edf0f4;padding:9px 4px}.warning{font-size:13px;color:#7c4b20}select{width:100%;margin:8px 0;padding:11px;border:1px solid #d2dce5;border-radius:10px;font-size:16px;background:white;color:#1c2a37}.distance-details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.distance-details div{padding:10px 7px;background:#f3f8f7;border-radius:10px;text-align:center}.distance-details small{display:block;color:#617082;font-size:11px}.distance-details strong{font-size:15px}.advice{background:#f0f8f5;border-left:3px solid #087f70;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.45}.advice b{color:#096f5f}.badge{display:inline-block;background:#e4f3ef;color:#096f5f;border-radius:20px;padding:5px 10px;font-size:12px}@media(max-width:460px){.stats strong{font-size:21px}.product .flex{align-items:flex-start}.rates{margin-top:8px}}.status-low{color:#a34b12;font-weight:700}.status-ok{color:#087f70;font-weight:700}.status-high{color:#9c5319;font-weight:700}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profile-grid input{display:block;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:9px;margin-top:6px;font:inherit}<\/style><\/head><body><main class=\"wrap\"><h1>🏊🚴🏃 Nutrición Triatlón<\/h1><p>Planifica los hidratos por segmento y ajusta las unidades de cada producto.<\/p><section><h2>Distancia de la prueba<\/h2><label for=\"distance\">Modalidad<\/label><select id=\"distance\" aria-label=\"Distancia de triatlón\"><option value=\"supersprint\">Supersprint<\/option><option value=\"sprint\">Sprint<\/option><option value=\"olimpico\">Olímpico<\/option><option value=\"medio\">Medio · 70.3<\/option><option value=\"completo\">Completo · 140.6<\/option><\/select><div id=\"distanceDetails\" class=\"distance-details\"><\/div><p class=\"muted\" style=\"font-size:13px;margin-bottom:0\">Las duraciones son estimaciones iniciales: ajústalas según tu ritmo previsto. Las distancias pueden variar según la prueba, especialmente en supersprint.<\/p><\/section><section><h2>Perfil del deportista<\/h2><div class=\"profile-grid\"><div><label for=\"weight\">Peso (kg)<\/label><input id=\"weight\" type=\"number\" min=\"30\" max=\"250\" step=\"0.5\" value=\"70\"><\/div><div><label for=\"age\">Edad (años)<\/label><input id=\"age\" type=\"number\" min=\"16\" max=\"100\" step=\"1\" value=\"47\"><\/div><\/div><p class=\"muted\" style=\"font-size:13px\">El peso sirve para orientar la alimentación previa y la recuperación. La edad no modifica automáticamente los hidratos por hora: influyen más la duración, la intensidad y tu tolerancia digestiva.<\/p><div id=\"profileAdvice\" class=\"advice\"><\/div><\/section><section><h2>Alimentación antes de la salida<\/h2><p class=\"muted\">Selecciona tus alimentos habituales antes de comenzar. Los hidratos son estimaciones por ración y pueden variar según la marca, la fruta y la preparación. La recomendación en g/kg depende del tiempo disponible y de la tolerancia digestiva. Evita comidas ricas en grasas o fibra demasiado cerca de la salida.<\/p><div id=\"beforeFood\" aria-label=\"Seleccionar alimentación antes de competir\"><\/div><div id=\"beforeTotal\" class=\"advice\"><\/div><\/section><section><div class=\"flex\"><h2>Segmentos de la prueba<\/h2><button id=\"reset\">Reiniciar alimentos<\/button><\/div><div id=\"segments\"><\/div><\/section><section><h2>Alimentación después de la prueba<\/h2><p class=\"muted\">Selecciona alimentos naturales para recuperarte. La recomendación de HC de recuperación rápida es especialmente relevante si vuelves a entrenar en las siguientes horas; acompáñalos de proteínas y líquidos según tus necesidades.<\/p><div id=\"afterFood\" aria-label=\"Seleccionar alimentación después de competir\"><\/div><div id=\"afterTotal\" class=\"advice\"><\/div><\/section><section><h2>Resumen de la prueba<\/h2><p class=\"muted\" style=\"font-size:13px\">Las recomendaciones por segmento son rangos orientativos, distintos del objetivo manual que configuras debajo de cada segmento.<\/p><div class=\"stats\"><div><small>Duración total<\/small><strong id=\"duration\"><\/strong><\/div><div><small>Objetivo de hidratos<\/small><strong id=\"target\"><\/strong><\/div><div><small>Hidratos preparados<\/small><strong id=\"carbs\"><\/strong><\/div><div><small>Calorías preparadas<\/small><strong id=\"kcal\"><\/strong><\/div><div><small>Media de hidratos<\/small><strong id=\"average\"><\/strong><\/div><\/div><div class=\"bar\"><div class=\"fill\" id=\"progress\"><\/div><\/div><p id=\"notice\"><\/p><table class=\"summary\" id=\"table\"><\/table><p class=\"warning\" id=\"caffeine\"><\/p><div id=\"wholeDay\" class=\"advice\"><\/div><button id=\"copy\" class=\"primary\">Copiar planificación<\/button><\/section><p class=\"muted\">Las cantidades reflejan lo que prevés consumir, no lo que realmente has ingerido. La natación no incluye alimentación durante el segmento. Los rangos sugeridos son orientativos, no una prescripción. El cálculo por segmentos no debe interpretarse como una obligación de consumir el máximo en cada uno; adapta la ingesta a la intensidad, tolerancia digestiva y puestos de avituallamiento. Las transiciones no están incluidas en el tiempo total. Por tus antecedentes cardíacos, confirma la cafeína y las pautas de hidratación con tu equipo médico.<\/p><\/main><script>const CONFIG={\"segments\": [{\"name\": \"Natación\", \"hours\": 0.5, \"rate\": 0, \"edible\": false, \"q\": [0, 0, 0, 0, 0]}, {\"name\": \"Ciclismo\", \"hours\": 2, \"rate\": 60, \"edible\": true, \"q\": [1, 1, 0, 1, 0]}, {\"name\": \"Carrera a pie\", \"hours\": 1, \"rate\": 40, \"edible\": true, \"q\": [0, 0, 0, 0, 0]}], \"products\": [{\"name\": \"Bidón Amix 750 ml\", \"desc\": \"60 g de polvo · 56,4 g HC\", \"carbs\": 56.4, \"kcal\": 228, \"caffeine\": 0}, {\"name\": \"Barrita energética\", \"desc\": \"32 g · 27 g HC\", \"carbs\": 27, \"kcal\": 108, \"caffeine\": 0}, {\"name\": \"Gel con cafeína\", \"desc\": \"40 g · 25 g HC · 60 mg cafeína\", \"carbs\": 25, \"kcal\": 100, \"caffeine\": 60}, {\"name\": \"Bocadillo de guayaba\", \"desc\": \"26,4 g · 22,4 g HC\", \"carbs\": 22.430555555555554, \"kcal\": 90.5138888888889, \"caffeine\": 0}, {\"name\": \"PowerBar PowerGel + Caffeine\", \"desc\": \"67 ml · 30 g HC · 103 kcal · 100 mg cafeína\", \"carbs\": 30, \"kcal\": 103, \"caffeine\": 100}]};const PRESETS={supersprint:{dist:[\"400 m\",\"10 km\",\"2,5 km\"],hours:[0.17,0.4,0.25]},sprint:{dist:[\"750 m\",\"20 km\",\"5 km\"],hours:[0.33,0.75,0.5]},olimpico:{dist:[\"1,5 km\",\"40 km\",\"10 km\"],hours:[0.5,1.5,1]},medio:{dist:[\"1,9 km\",\"90 km\",\"21,1 km\"],hours:[0.75,3,2]},completo:{dist:[\"3,8 km\",\"180 km\",\"42,2 km\"],hours:[1.5,6,4.5]}};const TITLE=\"Triatl\\u00f3n\";const cfg=CONFIG;let segs=cfg.segments;const products=cfg.products;const beforeProducts=[\n{name:'Atún claro al natural',desc:'1 lata escurrida (≈52 g)',carbs:0,kcal:60,caffeine:0},\n{name:'Tortilla de dos huevos',desc:'2 huevos sin añadidos',carbs:1,kcal:145,caffeine:0},\n{name:'Tortita de arroz',desc:'1 unidad (≈8 g)',carbs:6.5,kcal:30,caffeine:0},\n{name:'Jamón de pavo 92 %',desc:'1 loncha (≈25 g); comprobar etiqueta',carbs:0.5,kcal:25,caffeine:0},\n{name:'Yogur griego natural',desc:'125 g, sin azúcar añadido',carbs:5,kcal:160,caffeine:0},\n{name:'Yogur natural',desc:'125 g, sin azúcar añadido',carbs:6,kcal:75,caffeine:0},\n{name:'Pieza de fruta (plátano)',desc:'1 plátano mediano (≈120 g de parte comestible)',carbs:23,kcal:105,caffeine:0},\n{name:'Vaso de leche',desc:'200 ml de leche de vaca',carbs:9.6,kcal:120,caffeine:0},\n{name:'Café con leche',desc:'Sin azúcar; 150 ml de leche + café',carbs:7.2,kcal:90,caffeine:60},\n{name:'Pan blanco',desc:'90 g de pan blanco',carbs:45,kcal:240,caffeine:0},\n{name:'Frutos secos al natural',desc:'1 ración de 30 g, sin azúcar añadido (valor aproximado)',carbs:5,kcal:180,caffeine:0},\n{name:'Copos de avena',desc:'1 ración de 25 g, en seco (≈15 g HC)',carbs:15,kcal:95,caffeine:0}\n];const extraFood={before:Array(beforeProducts.length).fill(0),after:Array(beforeProducts.length-1).fill(0)};\nconst catalog=phase=>phase==='before'?beforeProducts:beforeProducts.slice(0,-1);\nconst extraTotals=phase=>extraFood[phase].reduce((a,n,i)=>{const p=catalog(phase)[i];a.hc+=n*p.carbs;a.kcal+=n*p.kcal;a.caff+=n*p.caffeine;return a},{hc:0,kcal:0,caff:0});const $=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:1});const rnd=n=>Math.round(n);\nfunction suggested(i,h){\n if(i===0)return {lo:0,hi:0,note:'No se ingieren hidratos durante la natación. La energía para este segmento procede de las reservas y de la alimentación previa.'};\n const mins=h*60;\n if(i===1){\n  if(mins<=60)return {lo:0,hi:30,note:'En un tramo corto de bicicleta puede bastar con agua o una pequeña cantidad de HC; considera la duración total de la prueba.'};\n  if(mins<=150)return {lo:40,hi:60,note:'Para este tramo, 40–60 g/h es un punto de partida habitual; en competición exigente puedes necesitar más según tolerancia.'};\n  return {lo:60,hi:90,note:'En recorridos largos se suele buscar 60–90 g/h, entrenando previamente la tolerancia digestiva.'};\n }\n if(mins<=30)return {lo:0,hi:20,note:'En carreras cortas, la ingesta durante el segmento puede ser innecesaria. Cuenta también lo tomado antes y en la bicicleta.'};\n if(mins<=60)return {lo:20,hi:40,note:'Durante la carrera es más difícil ingerir alimentos; prioriza geles y líquido según tolerancia.'};\n return {lo:30,hi:60,note:'En carrera prolongada, 30–60 g/h puede ser un objetivo orientativo; adáptalo a tu tolerancia y avituallamientos.'};\n}\nconst durationLabel=h=>{let m=Math.round(h*60);return m<60?m+' min':(m%60===0?m/60+' h':Math.floor(m/60)+' h '+m%60+' min')};function totals(s){return {hc:s.q.reduce((a,q,i)=>a+q*products[i].carbs,0),kcal:s.q.reduce((a,q,i)=>a+q*products[i].kcal,0),caff:s.q.reduce((a,q,i)=>a+q*products[i].caffeine,0)}}function profileAdvice(){const w=Number($('weight').value),age=Number($('age').value);if(!Number.isFinite(w)||w<30||w>250||!Number.isFinite(age)||age<16||age>100){$('profileAdvice').textContent='Introduce un peso y una edad válidos.';return}const duration=segs.reduce((a,s)=>a+s.hours,0);const beforeLo=rnd(w*1),beforeHi=rnd(w*2),afterLo=rnd(w*1),afterHi=rnd(w*1.2);$('profileAdvice').innerHTML=`<b>Orientación personalizada<\/b><br>Antes de competir: ${beforeLo}–${beforeHi} g HC (1–2 g/kg unas 1–3 h antes, según tolerancia y tiempo disponible).<br>Recuperación rápida si vuelves a entrenar pronto: ${afterLo}–${afterHi} g HC por hora durante las primeras horas (1–1,2 g/kg/h).<br>Durante la prueba (${durationLabel(duration)}): usa las recomendaciones de cada segmento; no se ajustan automáticamente por edad o peso.`;}function drawExtraFood(){for(const phase of ['before','after']){const q=extraFood[phase],items=catalog(phase),t=extraTotals(phase);$(phase+'Food').innerHTML=items.map((p,i)=>`<div class=\"product\"><div class=\"flex\"><div><b>${p.name}<\/b><small>${p.desc} · ${fmt(p.carbs)} g HC/ración<\/small><\/div><div class=\"counter\"><button data-extra=\"${phase}\" data-product=\"${i}\" data-delta=\"-1\" aria-label=\"Quitar ${p.name}\">−<\/button><output>${q[i]}<\/output><button data-extra=\"${phase}\" data-product=\"${i}\" data-delta=\"1\" aria-label=\"Añadir ${p.name}\">+<\/button><\/div><\/div><\/div>`).join('');const w=Number($('weight').value);const valid=Number.isFinite(w)&&w>=30&&w<=250;const lo=valid?Math.round(w):0,hi=valid?Math.round(w*(phase==='before'?2:1.2)):0;const gap=lo-t.hc;let status='';if(!valid){status='Introduce un peso válido para ver el objetivo.'}else if(t.hc<lo){status=`<span class=\"status-low\">Por debajo del rango: faltan ≈${fmt(gap)} g HC para alcanzar el mínimo.<\/span>`}else if(t.hc<=hi){status='<span class=\"status-ok\">Dentro del rango orientativo de HC.<\/span>'}else{status=`<span class=\"status-high\">Por encima del rango: ≈${fmt(t.hc-hi)} g HC de más.<\/span>`}$(phase+'Total').innerHTML=`<b>Objetivo orientativo: ${valid?fmt(lo)+'–'+fmt(hi)+' g HC':'—'}<\/b><br><b>Alimentos seleccionados: ${fmt(t.hc)} g HC · ${rnd(t.kcal)} kcal<\/b>${t.caff?' · ≈'+rnd(t.caff)+' mg cafeína':''}<br>${status}<div class=\"bar\"><div class=\"fill\" style=\"width:${valid?Math.min(100,100*t.hc/lo):0}%\"><\/div><\/div><small>${phase==='before'?'Referencia: 1–2 g/kg aproximadamente 1–3 h antes; ajusta según la comida previa y el margen hasta la salida.':'Referencia de recuperación rápida: 1–1,2 g/kg/h cuando hay poco tiempo entre sesiones; no es necesario alcanzar este rango de inmediato si tienes muchas horas o días para recuperarte.'} La edad no cambia automáticamente este cálculo.<\/small>`;}}\nfunction draw(){profileAdvice();drawExtraFood();let distances=PRESETS[$('distance').value].dist;$('distanceDetails').innerHTML=distances.map((d,i)=>`<div><small>${['🏊 Natación','🚴 Ciclismo','🏃 Carrera'][i]}<\/small><strong>${d}<\/strong><\/div>`).join('');let html='';segs.forEach((s,i)=>{let t=totals(s), rec=suggested(i,s.hours), low=Math.round(rec.lo*s.hours), high=Math.round(rec.hi*s.hours);html+=`<div class=\"seg\"><div class=\"flex\"><h3>${i+1}. ${s.name} · ${distances[i]}<\/h3><span class=\"badge\">${durationLabel(s.hours)}<\/span><\/div><label>Duración: <strong>${durationLabel(s.hours)}<\/strong><\/label><input type=\"range\" data-hours=\"${i}\" min=\"0.25\" max=\"8\" step=\"0.25\" value=\"${s.hours}\"><div class=\"advice\"><b>HC recomendados para este segmento: ${low===high?low+' g':low+'–'+high+' g'}<\/b> (${rec.lo===rec.hi?rec.lo:rec.lo+'–'+rec.hi} g/h).<br>${rec.note}<\/div><div class=\"flex\" style=\"margin:9px 0\"><span>Tu objetivo<\/span><div class=\"rates\">${(s.edible?[0,30,40,60,90]:[0]).map(r=>`<button data-rate=\"${i}\" data-value=\"${r}\" class=\"${r===s.rate?'active':''}\">${r===0?'0':r+' g/h'}<\/button>`).join('')}<\/div><\/div>${s.edible?products.map((p,j)=>`<div class=\"product\"><div class=\"flex\"><div><b>${p.name}<\/b><small>${p.desc}<\/small><\/div><div class=\"counter\"><button data-seg=\"${i}\" data-product=\"${j}\" data-delta=\"-1\" aria-label=\"Quitar ${p.name}\">−<\/button><output>${s.q[j]}<\/output><button data-seg=\"${i}\" data-product=\"${j}\" data-delta=\"1\" aria-label=\"Añadir ${p.name}\">+<\/button><\/div><\/div><\/div>`).join(''):'<p class=\"muted\">Durante la natación no se planifica ingesta. Puedes ajustar la duración; el objetivo de hidratos se establece en 0.<\/p>'}<p><b>Segmento:<\/b> ${rnd(t.hc)} g HC · ${rnd(t.kcal)} Cal · Objetivo ${rnd(s.hours*s.rate)} g<\/p><\/div>`});$('segments').innerHTML=html;const all=segs.reduce((a,s)=>{let t=totals(s);a.h+=s.hours;a.target+=s.hours*s.rate;a.hc+=t.hc;a.kcal+=t.kcal;a.caff+=t.caff;return a},{h:0,target:0,hc:0,kcal:0,caff:0});$('duration').textContent=durationLabel(all.h);$('target').textContent=rnd(all.target)+' g';$('carbs').textContent=rnd(all.hc)+' g';$('kcal').textContent=rnd(all.kcal)+' Cal';$('average').textContent=fmt(all.hc/(all.h||1))+' g/h';$('progress').style.width=Math.min(100,all.target?100*all.hc/all.target:100)+'%';let d=all.hc-all.target;$('notice').textContent=d< -5?`Faltan ${rnd(-d)} g de hidratos para el objetivo configurado.`:d>15?`Hay ${rnd(d)} g de hidratos por encima del objetivo.`:'La planificación se aproxima al objetivo.';$('wholeDay').textContent='Plan completo (antes + competición + después): '+rnd(all.hc+extraTotals('before').hc+extraTotals('after').hc)+' g HC · '+rnd(all.kcal+extraTotals('before').kcal+extraTotals('after').kcal)+' kcal. Los objetivos y la barra de progreso anteriores corresponden únicamente a la competición.';$('caffeine').textContent=(all.caff+extraTotals('before').caff+extraTotals('after').caff)?`Cafeína total (antes, durante y después): ${rnd(all.caff+extraTotals('before').caff+extraTotals('after').caff)} mg. Consulta con tu cardiólogo su idoneidad.`:'';$('table').innerHTML='<tr><th>Segmento<\/th><th>Objetivo<\/th><th>Preparado<\/th><\/tr>'+segs.map(s=>`<tr><td>${s.name}<\/td><td>${rnd(s.hours*s.rate)} g<\/td><td>${rnd(totals(s).hc)} g<\/td><\/tr>`).join('');}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.extra!==undefined){let q=extraFood[b.dataset.extra],j=+b.dataset.product;q[j]=Math.max(0,Math.min(30,q[j]+Number(b.dataset.delta)));draw()}else if(b.dataset.seg!==undefined){let s=segs[+b.dataset.seg],j=+b.dataset.product;s.q[j]=Math.max(0,Math.min(30,s.q[j]+Number(b.dataset.delta)));draw()}else if(b.dataset.rate!==undefined){segs[+b.dataset.rate].rate=Number(b.dataset.value);draw()}});document.addEventListener('change',e=>{if(e.target.dataset.hours!==undefined){segs[+e.target.dataset.hours].hours=Number(e.target.value);draw()}});$('distance').onchange=()=>{let preset=PRESETS[$('distance').value];segs.forEach((s,i)=>{s.hours=preset.hours[i]});draw()};$('reset').onclick=()=>{segs.forEach(s=>s.q=[0,0,0,0,0]);extraFood.before=Array(beforeProducts.length).fill(0);extraFood.after=Array(catalog('after').length).fill(0);draw()};$('copy').onclick=async()=>{let txt='Plan nutricional '+TITLE+'\\nANTES: '+extraFood.before.map((q,i)=>q+' × '+beforeProducts[i].name).join(', ')+'\\n'+segs.map(s=>s.name+' ('+durationLabel(s.hours)+', '+s.rate+' g/h): '+s.q.map((q,i)=>q+' × '+products[i].name).join(', ')+'; HC '+rnd(totals(s).hc)+' g').join('\\n')+'\\nDESPUÉS: '+extraFood.after.map((q,i)=>q+' × '+catalog('after')[i].name).join(', ');try{await navigator.clipboard.writeText(txt);$('copy').textContent='¡Copiado!'}catch{prompt('Copia la planificación:',txt)}};$('weight').addEventListener('input',draw);$('age').addEventListener('input',draw);$('distance').value='olimpico';PRESETS.olimpico.hours.forEach((h,i)=>{segs[i].hours=h});draw();<\/script><\/body><\/html>"};
const panels=document.getElementById('panels');
function choose(sport){
 if(!pages[sport])return;
 for(const button of document.querySelectorAll('[data-sport]'))button.setAttribute('aria-pressed',String(button.dataset.sport===sport));
 let panel=document.getElementById('panel-'+sport);
 if(!panel){
  panel=document.createElement('section');panel.className='panel';panel.id='panel-'+sport;
  const frame=document.createElement('iframe');frame.className='frame';frame.title='Calculadora de '+sport;frame.setAttribute('loading','eager');
  panel.appendChild(frame);panels.appendChild(panel);frame.srcdoc=pages[sport];
 }
 for(const other of panels.children)other.hidden=other!==panel;
}
document.querySelectorAll('[data-sport]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.sport)));
</script></body></html>
